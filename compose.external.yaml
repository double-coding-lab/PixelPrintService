# App-only deployment. Configure reachable MySQL/Redis endpoints in project.config.json.
services:
  app:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - ./project.config.json:/app/project.config.json:ro
      - app_data:/app/.data
      - app_runtime:/app/.runtime
    command: ['sh', '-c', 'npm run db:init && npm start']
    restart: unless-stopped
volumes:
  app_data:
  app_runtime:
